<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>AI Talk — Live Call</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,600;0,9..40,700;1,9..40,400&family=Fraunces:opsz,wght@9..144,600;9..144,700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <div class="bg"></div>
  <main class="shell">
    <header class="top">
      <p class="brand">AI Talk</p>
      <p class="tag">Realtime English call — speak naturally, no hold button</p>
    </header>

    <section class="panel" id="pickPanel">
      <h1>Pick a practice topic</h1>
      <p class="lead">Choose a scenario, then join a live call with your coach.</p>
      <div class="topics" id="topics"></div>
    </section>

    <section class="panel hidden" id="talkPanel">
      <div class="talk-head">
        <div>
          <p class="eyebrow" id="topicLabel">Topic</p>
          <h2 id="sessionMeta">Session</h2>
        </div>
        <button type="button" class="ghost" id="backBtn">End & change topic</button>
      </div>

      <div class="call-banner" id="callBanner">
        <span class="pulse-ring" id="callPulse"></span>
        <span id="callState">Ready to join call</span>
      </div>

      <div class="stage" id="stage">
        <p class="hint">Starting coach…</p>
      </div>

      <p class="live-partial" id="partial"></p>
      <p class="latency" id="latency"></p>
      <div class="keywords" id="keywords"></div>

      <div class="controls">
        <button type="button" class="mic" id="callBtn" disabled>
          <span class="mic-dot"></span>
          <span id="callLabel">Join Call</span>
        </button>
        <p class="status" id="status">Waiting for session…</p>
      </div>
    </section>
  </main>

  <audio id="player" preload="auto"></audio>
  <script src="./app.js"></script>
</body>
</html>
